name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # expo-env.d.ts is gitignored; `expo start` writes it locally. It pulls in
      # Expo's web style types (e.g. position: 'sticky'), so create it here too.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npx tsc --noEmit -p .
      - run: npm test

  db:
    name: Database and sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks GitHub's API for the newest release, which can
          # hit its rate limit and fail the job before any test runs.
          version: 2.116.0
      - run: npm run db:start
      - run: npm run test:db
