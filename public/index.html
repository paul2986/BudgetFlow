<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">

<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <meta http-Equiv="Cache-Control" Content="no-cache" />
  <meta http-Equiv="Pragma" Content="no-cache" />
  <meta http-Equiv="Expires" Content="0" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>%WEB_TITLE%</title>
  <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
  <style id="expo-reset">
    /* These styles make the body full-height */
    html,
    body {
      height: var(--app-height, calc(100dvh + var(--toolbar-overhang, 0px)));
      background-color: #0B1220;
      /* Prevent white bands on iOS */
    }

    /* These styles disable document scrolling; screens scroll inside <ScrollView> */
    html,
    body {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* These styles make the root element full-height */
    #root {
      display: flex;
      height: var(--app-height, calc(100dvh + var(--toolbar-overhang, 0px)));
      flex: 1;
      background-color: #0B1220;
    }
  </style>
  <script>
    // iOS home-screen web apps with a black-translucent status bar report a
    // layout viewport that is short by the status-bar height, so 100dvh and
    // `position: fixed; bottom: 0` stop well above the home indicator. Measure
    // the real screen height and expose it as --app-height for the shell.
    (function () {
      // navigator.standalone only exists on iOS: false in a Safari tab.
      if (window.navigator.standalone === false) {
        // iOS 26+ Safari floats its toolbar over the page and paints
        // whatever the page draws below its visible area (100dvh) down to
        // the screen's bottom edge. The shell stops at 100dvh, so that band
        // was a solid block. Extend the shell past 100dvh by the screen
        // height the viewport doesn't cover (--toolbar-overhang); the extra
        // is only visible behind the toolbar, and bottomClearance() lifts
        // bottom-anchored UI (tab bar, toasts, scroll insets) back above it.
        var setOverhang = function () {
          var portrait = window.innerWidth <= window.innerHeight;
          var fullH = portrait
            ? Math.max(screen.width, screen.height)
            : Math.min(screen.width, screen.height);
          var over = Math.max(0, fullH - window.innerHeight);
          document.documentElement.style.setProperty('--toolbar-overhang', over + 'px');
        };
        setOverhang();
        window.addEventListener('resize', setOverhang);
        // The taller shell makes the document scrollable by script (e.g.
        // iOS scrolling a focused input into view) despite overflow: hidden;
        // screens scroll inside their own containers, so pin the page at 0.
        window.addEventListener('scroll', function () {
          if (window.scrollY !== 0) window.scrollTo(0, 0);
        }, { passive: true });
        return;
      }
      if (window.navigator.standalone !== true) return; // iOS standalone only
      function setAppHeight() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var portrait = w <= h;
        var long = Math.max(screen.width, screen.height);
        var short = Math.min(screen.width, screen.height);
        var fullW = portrait ? short : long;
        var fullH = portrait ? long : short;
        // Only correct the known small shortfall on a full-screen window;
        // leave iPad windowing / split view alone.
        if (w === fullW && fullH > h && fullH - h <= 100) h = fullH;
        document.documentElement.style.setProperty('--app-height', h + 'px');
        // iOS 27 draws a Liquid Glass blur below the status bar that no CSS
        // or meta tag disables. A 20px gap under the inset (space.s5, the
        // gap confirmed sharp on device) keeps header text clear of it.
        // Landscape hides the status bar, so no gap there.
        document.documentElement.style.setProperty('--status-gap', portrait ? '20px' : '0px');
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight);
      window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 300); });
    })();
  </script>
  <script>
    window.canInstall = false;
    window.deferredPrompt = null;

    window.addEventListener('load', async () => {

      // Skip PWA installation and service worker code if we're in development mode (index.ts.bundle exists)
      // or if we're in Expo development environment
      if (!document.querySelector('script[src*="index.ts.bundle"]') && !window.location.href.includes('exp.direct')) {

        window.handleInstallClick = async () => {
          console.debug("handleInstallClick called");

          if (!window.deferredPrompt) return;

          // Show the install prompt
          window.deferredPrompt.prompt();

          console.debug("window.deferredPrompt.prompt called");

          // Wait for the user to respond to the prompt
          const { outcome } = await window.deferredPrompt.userChoice;

          // Hide the install button
          if (outcome === 'accepted') {
            canInstall = false;
          }
        };

        window.handleBeforeInstallPrompt = (e) => {
          console.debug("handleBeforeInstallPrompt called");

          // Prevent Chrome 67 and earlier from automatically showing the prompt
          e.preventDefault();

          // Stash the event so it can be triggered later
          window.deferredPrompt = e;

          // Update UI to notify the user they can install the PWA
          window.canInstall = true;
        };

        window.addEventListener('beforeinstallprompt', window.handleBeforeInstallPrompt);

        if ('serviceWorker' in navigator) {
          // Unregister any existing service worker first
          const existingRegistration = await navigator.serviceWorker.getRegistration();
          if (existingRegistration) {
            console.log('Unregistering existing service worker');
            await existingRegistration.unregister();
          }

          const registration = await navigator.serviceWorker.register('./sw.js');
          console.log('Service Worker registered with scope:', registration.scope);

          // Check for updates every 30 seconds
          setInterval(async () => {
            try {
              await registration.update();
            } catch (error) {
              console.error('Error checking for updates:', error);
            }
          }, 200);

          // Listen for updates
          registration.addEventListener('updatefound', () => {
            console.log('Service Worker update found');
            if (registration.installing) {
              registration.installing.addEventListener('statechange', () => {
                if (registration.waiting) {
                  // Automatically activate the new service worker
                  registration.waiting.postMessage('SKIP_WAITING');
                }
              });
            }
          });

          // // Listen for controller change to refresh the page
          // navigator.serviceWorker.addEventListener('controllerchange', () => {
          //   console.log('New service worker activated, refreshing page');
          //   window.location.reload();
          // });

          // Earlier builds cached every request, including Supabase API
          // responses, in Workbox's default runtime cache. Remove it; the
          // same-origin runtime cache is now named 'app-runtime'.
          caches.delete('workbox-runtime-' + registration.scope).catch(() => {});
        }
      }
    });
  </script>
</head>
