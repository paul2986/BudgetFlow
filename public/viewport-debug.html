<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Mirrors the app's viewport + status-bar tags so the numbers match it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Viewport debug</title>
  <style>
    html, body { margin: 0; height: 100lvh; overflow: hidden; background: #3b0764; }
    body { font: 13px/1.35 -apple-system, system-ui, sans-serif; color: #fff; }
    /* Full-lvh block: anything purple below it is outside the layout box. */
    #lvh { position: absolute; top: 0; left: 0; right: 0; height: 100lvh; background: #0b1220; }
    .line { position: absolute; left: 0; right: 0; height: 2px; }
    #dvh { top: calc(100dvh - 2px); background: #22d3ee; }
    #svh { top: calc(100svh - 2px); background: #facc15; }
    #fixed { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #f43f5e; }
    #out { position: absolute; top: 25%; left: 12px; right: 12px; white-space: pre; background: rgba(0,0,0,.6); padding: 8px; border-radius: 8px; }
    .probe { position: absolute; visibility: hidden; top: 0; left: 0; width: 1px; }
  </style>
</head>
<body>
  <div id="lvh"></div>
  <div class="line" id="svh"></div>
  <div class="line" id="dvh"></div>
  <div id="fixed"></div>
  <div class="probe" id="p-lvh" style="height:100lvh"></div>
  <div class="probe" id="p-dvh" style="height:100dvh"></div>
  <div class="probe" id="p-svh" style="height:100svh"></div>
  <div class="probe" id="p-vh" style="height:100vh"></div>
  <div class="probe" id="p-top" style="height:env(safe-area-inset-top)"></div>
  <div class="probe" id="p-bot" style="height:env(safe-area-inset-bottom)"></div>
  <div id="out"></div>
  <script>
    function h(id) { return Math.round(document.getElementById(id).getBoundingClientRect().height); }
    function render() {
      var vv = window.visualViewport;
      var fx = document.getElementById('fixed').getBoundingClientRect();
      document.getElementById('out').textContent = [
        'standalone: ' + (navigator.standalone === true),
        'screen: ' + screen.width + ' x ' + screen.height,
        'innerHeight: ' + innerHeight,
        'clientHeight: ' + document.documentElement.clientHeight,
        'visualViewport: h=' + (vv && Math.round(vv.height)) + ' top=' + (vv && Math.round(vv.offsetTop)),
        '100lvh: ' + h('p-lvh') + '   100dvh: ' + h('p-dvh'),
        '100svh: ' + h('p-svh') + '   100vh: ' + h('p-vh'),
        'safe-area top: ' + h('p-top') + '   bottom: ' + h('p-bot'),
        'fixed bottom:0 lands at y=' + Math.round(fx.bottom),
        '',
        'navy = 100lvh box, purple = outside it',
        'cyan line = 100dvh, yellow = 100svh',
        'red bar = position:fixed; bottom:0',
      ].join('\n');
    }
    render();
    addEventListener('resize', render);
    if (window.visualViewport) visualViewport.addEventListener('resize', render);
  </script>
</body>
</html>
